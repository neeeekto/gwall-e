# lefthook.yml (ENF-02) — git-hook orchestration for gwall-e
#
# Schema: Lefthook v2.1.9 (pre-commit / pre-push / commit-msg + commands/run/glob/stage_fixed —
#         unchanged from v1; see .planning/phases/04-enforcement/04-RESEARCH.md §Standard Stack, Pitfall 3).
# Activation (once per clone, after `make tools` installs lefthook v2.1.9 + `npm install` for commitlint):
#         lefthook install
# Source of truth for the linters/tests these hooks invoke:
#   - .golangci.yml        (v2 schema: linters.default + errorlint + depguard; formatters: gofumpt + gci)  [04-01]
#   - commitlint.config.mjs + package.json (exact-pinned @commitlint/cli)                                   [04-02]
# NOTE: the proto toolchain (buf) is wired into NO hook by design — no `.proto`
#       exist yet (D-10, no-phantom). Its skeleton config (buf.yaml/buf.gen.yaml)
#       stays manual/opt-in until real schemas land.

# ---------------------------------------------------------------------------
# pre-commit: lint + format (D-02). Formatting (gofumpt + gci) runs EMBEDDED in
# golangci-lint v2 `formatters` — do NOT call standalone gofumpt.
# All active modules are members of go.work (incl. services/inventory, D-01); lint
# each module root with go.work active — no per-module workspace override.
# parallel: false — lint passes share caches; keep deterministic.
# ---------------------------------------------------------------------------
pre-commit:
  parallel: false
  commands:
    lint-workspace:
      glob: "*.go"
      # in-workspace modules build with go.work active; lint each module root.
      run: |
        set -e
        for m in pkg services/analytics services/audit services/inventory; do
          (cd "$m" && golangci-lint run ./...)
        done
      stage_fixed: true

# ---------------------------------------------------------------------------
# pre-push: unit tests for ALL workspace modules (D-02). inventory IS included —
# it is a full go.work member that MUST compile (D-03 invariant). Tests run unit
# only (plain `go test ./...`, no integration build tag), so the gate never pulls
# Docker/testcontainers — integration suites live behind a build tag (D-15).
# parallel: false — keep deterministic output.
# ---------------------------------------------------------------------------
pre-push:
  parallel: false
  commands:
    test-pkg:
      run: cd pkg && go test ./...                  # real ginkgo suite (pkg/http)
    test-audit:
      run: cd services/audit && go test ./...
    test-analytics:
      run: cd services/analytics && go test ./...   # 0 packages currently → no-op, NOT an error (build.md)
    test-inventory:
      run: cd services/inventory && go test ./...   # unit only (no integration build tag, D-15)

# ---------------------------------------------------------------------------
# commit-msg: Conventional Commits via commitlint (D-04).
# `--no-install` fails loudly if `npm install` was skipped, rather than silently
# fetching a drifted commitlint from the network (Pitfall 6). `{1}` is lefthook's
# commit-message-file template var (resolves to .git/COMMIT_EDITMSG).
# ---------------------------------------------------------------------------
commit-msg:
  commands:
    commitlint:
      run: npx --no-install commitlint --edit {1}
